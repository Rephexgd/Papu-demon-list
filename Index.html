<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papu Demon List</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0f0f0f;
    color: white;
}

header {
    background: #1a1a1a;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    border-bottom: 2px solid #ff2e63;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 30px auto;
}

.level {
    background: #1c1c1c;
    margin: 15px 0;
    padding: 15px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: 0.3s;
    border-left: 5px solid #ff2e63;
}

.level:hover {
    transform: scale(1.02);
    background: #262626;
}

.rank {
    font-size: 22px;
    font-weight: bold;
    width: 50px;
}

.info {
    flex: 1;
}

.level-name {
    font-size: 20px;
    font-weight: bold;
}

.creator {
    font-size: 14px;
    color: #bbb;
}

.difficulty {
    font-size: 14px;
    color: #ff2e63;
    margin-top: 5px;
}

footer {
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<header>
    PAPU DEMON LIST 🔥
</header>

<div class="container">

    <!-- NIVEL 1 -->
    <div class="level">
        <div class="rank">#1</div>
        <div class="info">
            <div class="level-name">Nombre del Nivel</div>
            <div class="creator">por Creador</div>
            <div class="difficulty">Extreme Demon</div>
        </div>
    </div>

    <!-- NIVEL 2 -->
    <div class="level">
        <div class="rank">#2</div>
        <div class="info">
            <div class="level-name">Otro Nivel</div>
            <div class="creator">por TuAmigo</div>
            <div class="difficulty">Insane Demon</div>
        </div>
    </div>

</div>

<footer>
    Papu Demon List © 2026 | Hecho por ustedes 😎
</footer>

</body>
</html>
